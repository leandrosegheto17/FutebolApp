      de timeout de 8s (TASK.md Seção 6.2 item 3, decisão já registrada
      pelo Tech Lead) — nunca um resultado parcial/incompleto, sempre
      "falha técnica real", reaproveitado pelo estado genérico já previsto
      no `UX-SPEC.md` para T09 sem tela nova. `POST /api/times/sugestao`
      NÃO persiste `app.time`/`app.time_atleta` — devolve só a sugestão
