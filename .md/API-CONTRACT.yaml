      um erro HTTP); contrato de `SugestaoTimesConflitoResponse` é o
      formato EXATO exigido pelo ADR-010 (`restricoes_conflitantes`/
      `grupos_conflito`, um item por aresta/componente conexo — não o
      formato simplificado "sem solução", Opção B do ADR-010, rejeitada).
