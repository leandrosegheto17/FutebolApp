name: Deploy Staging

# Staging é automático a cada push em main que passar no CI (mais permissivo,
# conforme cicd-pipeline-configuration Core Framework #3). Aponta para um
# projeto Supabase de staging dedicado (nunca o legado de produção) — ver
# infra/README.md Seção 2.
#
# PRÉ-REQUISITO (não satisfeito nesta fase de preparação): secrets
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, SUPABASE_ACCESS_TOKEN,
# SUPABASE_STAGING_PROJECT_REF, SUPABASE_STAGING_DB_PASSWORD configurados no
# repositório. Enquanto ausentes, os jobs abaixo falham rápido com mensagem
# clara em vez de expor erro genérico (facilita diagnóstico, conforme
# cicd-pipeline-configuration Core Framework #4).

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read
  deployments: write

jobs:
  deploy-staging:
    name: Deploy para Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica secrets obrigatórios
        run: |
          missing=0
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_STAGING_PROJECT_REF SUPABASE_STAGING_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var ausente — configure em Settings > Secrets antes de acionar este workflow."
              missing=1
            fi
          done
          exit $missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations no projeto de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}" --password "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}"
          supabase db push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Build (ambiente staging)
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}" && vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (alias de staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          vercel alias set "$url" turma-do-rola-staging.vercel.app --token="${{ secrets.VERCEL_TOKEN }}"
